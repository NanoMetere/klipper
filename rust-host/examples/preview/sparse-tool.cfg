# Synthetic motion fixtures, not a real wiring setup.
[include printer.cfg]

[input_shaper]
shaper_freq_x: 56.6
shaper_type_y: ei
shaper_freq_y: 48.4

[toolchanger]

[tool T0]
tool_number: 0
extruder: extruder

[tool T2]
tool_number: 2
extruder: extruder1

[tool T6]
tool_number: 6
extruder: extruder2
params_pressure_advance: 0.04

[extruder]
step_pin: synthetic_extruder_step
dir_pin: synthetic_extruder_dir
rotation_distance: 6.4
microsteps: 8
nozzle_diameter: 0.4
filament_diameter: 1.75
min_temp: 0
max_temp: 300
max_extrude_cross_section: 0.64
max_extrude_only_distance: 15
max_extrude_only_velocity: 20
max_extrude_only_accel: 300
pressure_advance: 0.04

[extruder1]
step_pin: synthetic_extruder1_step
dir_pin: !synthetic_extruder1_dir
rotation_distance: 12.8
microsteps: 8
gear_ratio: 2:1
nozzle_diameter: 0.4
filament_diameter: 1.75
min_temp: 0
max_temp: 300
max_extrude_cross_section: 0.64
max_extrude_only_distance: 15
max_extrude_only_velocity: 20
max_extrude_only_accel: 300
pressure_advance: 0.04

[extruder2]
step_pin: synthetic_extruder2_step
dir_pin: synthetic_extruder2_dir
rotation_distance: 6.4
microsteps: 8
nozzle_diameter: 0.4
filament_diameter: 1.75
min_temp: 0
max_temp: 300
max_extrude_cross_section: 0.64
max_extrude_only_distance: 15
max_extrude_only_velocity: 20
max_extrude_only_accel: 300
pressure_advance: 0.0

