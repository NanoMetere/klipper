# Synthetic offline fixture. No pin or printer connection data.
[printer]
kinematics: corexy
max_velocity: 180
max_accel: 3100
max_z_velocity: 9
max_z_accel: 160

[include rails.cfg]


# Inert macro fixture for opt-in expansion.
[gcode_macro TEST_PATH]
gcode:
    G90
    G1 X{params.X|default(4.125)} Y5.25 Z0.5 F1800
    G1 X5.75 Y5.25 F4800
    TEST_FINISH

[gcode_macro TEST_FINISH]
gcode:
    G91
    G1 X-1 Y1 Z-.02
    G4 P117
    M400
