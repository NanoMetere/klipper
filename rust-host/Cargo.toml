[package]
name = "klipper-host-protocol"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["identify", "webhooks"]
identify = ["dep:flate2", "dep:serde", "dep:serde_json"]
webhooks = ["dep:serde", "dep:serde_json"]
python-bridge = []
long-step-preview = []
capture-replay = []
file-debug-preview = ["capture-replay"]
shaped-file-debug-preview = ["file-debug-preview"]
runtime-shaper-preview = ["shaped-file-debug-preview"]
runtime-shaper-workers = ["runtime-shaper-preview"]

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[[example]]
name = "identify_replay"
required-features = ["identify"]

[[example]]
name = "native_mcu"
required-features = ["identify"]

[[example]]
name = "webhook_replay"
required-features = ["webhooks"]

[[bin]]
name = "klipper-preview"
required-features = ["webhooks"]

[[example]]
name = "step_wire_replay"
required-features = ["identify"]

[[example]]
name = "mcu_config_replay"
required-features = ["identify"]

[[example]]
name = "trigger_sync_replay"
required-features = ["identify"]

[[example]]
name = "trigger_dispatch_replay"
required-features = ["identify"]

[[example]]
name = "print_stats_replay"
required-features = ["webhooks"]

[[example]]
name = "simulated_job"
required-features = ["identify"]

[[example]]
name = "virtual_stepper_replay"
required-features = ["identify"]

[[example]]
name = "virtual_job_timing"
required-features = ["identify"]

[[example]]
name = "moonraker_status_fixture"
required-features = ["identify", "webhooks"]

[[example]]
name = "status_update_timing"
required-features = ["webhooks"]

[[example]]
name = "mixed_tool_steps"

[[example]]
name = "display_status_replay"
required-features = ["webhooks"]

[[bin]]
name = "klipper-shared-preview"
required-features = ["webhooks"]

[[bin]]
name = "klipper-file-debug-preview"
