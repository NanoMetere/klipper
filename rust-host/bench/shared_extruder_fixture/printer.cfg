[mcu]
serial: /dev/unused
[printer]
kinematics: corexy
max_velocity: 250
max_accel: 4000
max_z_velocity: 15
max_z_accel: 200
[stepper_x]
step_pin: gpio1
dir_pin: gpio2
endstop_pin: gpio3
microsteps: 16
rotation_distance: 40
position_endstop: 0
position_max: 300
[stepper_y]
step_pin: gpio4
dir_pin: gpio5
endstop_pin: gpio6
microsteps: 16
rotation_distance: 40
position_endstop: 0
position_max: 300
[stepper_z]
step_pin: gpio7
dir_pin: gpio8
endstop_pin: gpio9
position_endstop: 0
position_max: 300
microsteps: 16
rotation_distance: 8
[force_move]
enable_force_move: True


[extruder]
heater_pin: gpio12
sensor_pin: analog0
sensor_type: EPCOS 100K B57560G104F
control: watermark
min_temp: 0
max_temp: 250
nozzle_diameter: 0.4
filament_diameter: 1.75

[extruder1]
heater_pin: gpio15
sensor_pin: analog1
sensor_type: EPCOS 100K B57560G104F
control: watermark
min_temp: 0
max_temp: 250
nozzle_diameter: 0.4
filament_diameter: 1.75

[extruder_stepper shared_extruder]
extruder: extruder
step_pin: gpio10
dir_pin: gpio11
microsteps: 16
rotation_distance: 22.17
pressure_advance: 0.04

[display_status]
